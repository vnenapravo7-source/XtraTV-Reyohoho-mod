name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag matching v<versionName>'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$RELEASE_TAG" = "v$version"
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Load release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          TARGET_ABI: ${{ matrix.abi }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PtargetAbi="$TARGET_ABI" --max-workers=2
      - name: Verify APK
        env:
          TARGET_ABI: ${{ matrix.abi }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          apk="dist/XtraTV-Reyohoho-mod-${RELEASE_TAG#v}-${TARGET_ABI}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          test -n "$signer"
          "$signer" verify --verbose "$apk"
          python3 .github/scripts/verify_apk.py "$apk" --abi "$TARGET_ABI" > "$apk.sha256"
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ matrix.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-apk-*
          merge-multiple: true
          path: dist
      - name: Create draft with four APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 4
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.sha256 --verify-tag --draft --title "XtraTV Reyohoho mod ${RELEASE_TAG#v}" --notes-file docs/release-notes.md
